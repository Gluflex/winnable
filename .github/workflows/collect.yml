name: Refresh hackathon data

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: python collector/collect.py
      - name: Test ranking against fresh data
        run: node tests/test_rank.mjs && node tests/test_ics_github.mjs
      - name: Commit data if it changed
        run: |
          git config user.name "winnable-bot"
          git config user.email "winnable-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Data $(date -u +%F)"
          git push
